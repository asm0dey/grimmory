name: Build Native Image (reusable)

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit SHA / ref to build
        required: true
        type: string
      tags:
        description: metadata-action tag rules (verbatim from caller)
        required: true
        type: string
      app_version:
        required: true
        type: string
      app_revision:
        required: true
        type: string
    secrets:
      dockerhub_username:
        required: false
      dockerhub_token:
        required: false

jobs:
  build-native:
    name: Build and Push Native Image (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.checkout_ref }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to Docker Hub
        if: ${{ vars.DOCKERHUB_REGISTRY != '' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ vars.DOCKERHUB_REGISTRY }}
            ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-native,onlatest=true
          tags: ${{ inputs.tags }}

      - name: Build and push Native image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            APP_VERSION=${{ inputs.app_version }}
            APP_REVISION=${{ inputs.app_revision }}
          cache-from: |
            type=gha,scope=native
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-native
          cache-to: |
            type=gha,scope=native,mode=max
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-native,mode=max
